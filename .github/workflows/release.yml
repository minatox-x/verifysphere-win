name: Build & Release Windows EXE

on:
  push:
    tags:
      - 'v*'          # Triggers on version tags: v1.0.0, v1.2.3, etc.
  workflow_dispatch:  # Also allows manual trigger from GitHub UI

jobs:
  build:
    name: Build Signed Release EXE
    runs-on: windows-latest   # Windows runner - required for WPF + WebView2

    steps:
      # ----------------------------------------------------------------
      # 1. Check out source
      # ----------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------------
      # 2. Set up .NET 8 (required for WPF / net8.0-windows)
      #    global.json at repo root pins the SDK so the runner's newer
      #    .NET 10 SDK does not interfere with restore.
      # ----------------------------------------------------------------
      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          dotnet-quality: 'ga'

      # ----------------------------------------------------------------
      # 3. Cache NuGet packages
      #    Use %USERPROFILE% path - ~/.nuget resolves incorrectly on
      #    Windows runners when multiple SDK versions are present.
      # ----------------------------------------------------------------
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.USERPROFILE }}\.nuget\packages
          key: nuget-win-${{ hashFiles('**/*.csproj', '**/global.json') }}
          restore-keys: nuget-win-

      # ----------------------------------------------------------------
      # 4. Restore dependencies
      #    Pass -r win-x64 here so restore pre-fetches the right RID
      #    assets; this prevents the "RestoreTask returned false" error
      #    that occurs when RID is only known at publish time.
      #    Also pass -p:PublishReadyToRun=true here - the publish step
      #    below uses ReadyToRun, and R2R needs its own runtime compiler
      #    pack (Microsoft.NETCore.App.Runtime.win-x64) pulled in at
      #    restore time. Without this flag here, restore fetches the
      #    plain runtime pack, and publish later fails with NETSDK1094
      #    ("valid runtime package was not found").
      # ----------------------------------------------------------------
      - name: Restore dependencies
        shell: pwsh
        run: |
          dotnet restore src/VerifySphere/VerifySphere.csproj `
            -r win-x64 `
            -p:PublishReadyToRun=true `
            --locked-mode:false

      # ----------------------------------------------------------------
      # 5. Build & publish self-contained single-file EXE
      #    --no-restore skips a second restore since step 4 already ran.
      #
      #    AssemblyVersion and FileVersion must be purely numeric
      #    (major.minor.build.revision), each part 0-65535 (stored as
      #    UInt16 in the PE header). Version (informational) may be any
      #    string. We compute both separately, and use day-of-year /
      #    minute-of-day for the numeric fallback so it never exceeds
      #    the 65535 limit.
      # ----------------------------------------------------------------
      - name: Build release EXE
        shell: pwsh
        run: |
          $REF = "${{ github.ref_name }}"
          # Strip leading 'v' for SemVer (e.g. v1.0.0 -> 1.0.0)
          $SEMVER = $REF -replace '^v', ''

          if ($SEMVER -match '^\d+(\.\d+)*$') {
            $parts = $SEMVER.Split('.') | ForEach-Object {
              $n = [int]$_
              if ($n -gt 65535) { $n = 65535 }   # clamp defensively, just in case
              $n
            }
            while ($parts.Count -lt 4) { $parts += 0 }
            $NUMERIC_VERSION = ($parts[0..3] -join '.')
            $INFO_VERSION    = $SEMVER
          } else {
            $now = Get-Date
            $dayOfYear = $now.DayOfYear                                   # 1-366
            $minuteOfDay = ($now.Hour * 60) + $now.Minute                 # 0-1439
            $NUMERIC_VERSION = "0.0.$dayOfYear.$minuteOfDay"
            $INFO_VERSION    = "manual-$($now.ToString('yyyyMMdd-HHmmss'))"
          }

          Write-Output "INFO_VERSION=$INFO_VERSION  NUMERIC_VERSION=$NUMERIC_VERSION"
          echo "info_version=$INFO_VERSION" >> $env:GITHUB_OUTPUT

          dotnet publish src/VerifySphere/VerifySphere.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            --no-restore `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:PublishReadyToRun=true `
            -p:Version=$INFO_VERSION `
            -p:AssemblyVersion=$NUMERIC_VERSION `
            -p:FileVersion=$NUMERIC_VERSION `
            -o publish/
        id: build_exe

      # ----------------------------------------------------------------
      # 6. Verify the EXE was produced
      # ----------------------------------------------------------------
      - name: Verify EXE was produced
        shell: pwsh
        run: |
          $exe = Get-ChildItem publish/ -Filter "*.exe" | Select-Object -First 1
          if (-not $exe) { throw "EXE not found in publish/" }
          Write-Output "EXE: $($exe.FullName)  ($([math]::Round($exe.Length/1MB,2)) MB)"

      # ----------------------------------------------------------------
      # 7. Rename EXE to include version tag (used as the "portable"
      #    download alongside the installer, for users who prefer a
      #    single file with no install step - though it will not get
      #    the verifysphere:// URI scheme registered automatically,
      #    since that is handled by the installer below).
      # ----------------------------------------------------------------
      - name: Rename EXE
        id: rename_exe
        shell: pwsh
        run: |
          $REF = "${{ github.ref_name }}"
          $SEMVER = $REF -replace '^v', ''
          if ($SEMVER -match '^\d+(\.\d+)*$') {
            $VERSION_LABEL = $REF   # keep the 'v' prefix for the filename e.g. v1.0.0
          } else {
            $VERSION_LABEL = "manual-$(Get-Date -Format 'yyyyMMdd-HHmmss')"
          }
          $NEW_NAME = "VerifySphere-${VERSION_LABEL}.exe"
          Copy-Item "publish/VerifySphere.exe" $NEW_NAME
          echo "exe_name=$NEW_NAME" >> $env:GITHUB_OUTPUT
          Write-Output "Renamed to: $NEW_NAME"

      # ----------------------------------------------------------------
      # 8. Install Inno Setup (installer/setup.iss compiler)
      #    windows-latest runners ship with Chocolatey pre-installed,
      #    so this does not require any extra setup or admin prompt in CI.
      # ----------------------------------------------------------------
      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          # ISCC.exe lives here after a Chocolatey install; add to PATH
          # for this job so later steps can call it directly by name.
          echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

      # ----------------------------------------------------------------
      # 9. Build the installer (verifysphere-setup.exe)
      #    - Copies the unversioned VerifySphere.exe next to setup.iss
      #      (the [Files] section in setup.iss expects it there)
      #    - Compiles with ISCC, passing the same version string used
      #      for the app itself so the installer's "About" matches
      #    - installer/setup.iss already contains the URI-scheme
      #      registration (HKCU\Software\Classes\verifysphere) baked in,
      #      so no separate PowerShell script is needed by the user at
      #      all - install and uninstall both happen from the wizard /
      #      Windows "Apps & Features" respectively.
      # ----------------------------------------------------------------
      - name: Build installer (verifysphere-setup.exe)
        shell: pwsh
        run: |
          Copy-Item "publish/VerifySphere.exe" "installer/VerifySphere.exe"
          $INFO_VERSION = "${{ steps.build_exe.outputs.info_version }}"
          ISCC.exe /DMyAppVersion="$INFO_VERSION" "installer\setup.iss"
          if (-not (Test-Path "installer\verifysphere-setup.exe")) {
            throw "Installer build failed - verifysphere-setup.exe not found"
          }
          Copy-Item "installer\verifysphere-setup.exe" "verifysphere-setup.exe"
          Write-Output "Installer built: verifysphere-setup.exe"

      # ----------------------------------------------------------------
      # 10. Upload installer + portable EXE as workflow artifacts
      #     (always available, even on non-tag/manual runs)
      # ----------------------------------------------------------------
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VerifySphere-Windows
          path: |
            verifysphere-setup.exe
            ${{ steps.rename_exe.outputs.exe_name }}
          retention-days: 30

      # ----------------------------------------------------------------
      # 11. Create GitHub Release (only on version tags)
      # ----------------------------------------------------------------
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            verifysphere-setup.exe
            ${{ steps.rename_exe.outputs.exe_name }}
          name: "VerifySphere ${{ github.ref_name }}"
          body: |
            ## VerifySphere ${{ github.ref_name }} (Windows)

            ### Installation (recommended)
            1. Download and run `verifysphere-setup.exe`
            2. Follow the setup wizard - no Administrator rights needed
            3. VerifySphere is installed, added to your Start Menu, listed
               in **Settings > Apps > Installed apps**, and the
               `verifysphere://` link handler is registered automatically

            To uninstall: **Settings > Apps > Installed apps > VerifySphere > Uninstall**
            (this also removes the `verifysphere://` URI scheme registration)

            ### Portable option
            `${{ steps.rename_exe.outputs.exe_name }}` is a standalone EXE for
            users who don't want to install anything. It will run fine, but
            since nothing registers it, clicking a `verifysphere://` link will
            not automatically open it - use the installer above for that.

            ### Usage
            Click or navigate to a `verifysphere://verify?data=<encrypted_payload>` link.

            ### Requirements
            - Windows 10 / 11 (x64)
            - Microsoft Edge WebView2 Runtime (usually pre-installed on Windows 10 1803+)
              If missing: https://developer.microsoft.com/microsoft-edge/webview2/
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
