name: Build & Release Windows EXE

on:
  push:
    tags:
      - 'v*'          # Triggers on version tags: v1.0.0, v1.2.3, etc.
  workflow_dispatch:  # Also allows manual trigger from GitHub UI

jobs:
  build:
    name: Build Signed Release EXE
    runs-on: windows-latest   # Windows runner — required for WPF + WebView2

    steps:
      # ----------------------------------------------------------------
      # 1. Check out source
      # ----------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------------
      # 2. Set up .NET 8 (required for WPF / net8.0-windows)
      #    global.json at repo root pins the SDK so the runner's newer
      #    .NET 10 SDK does not interfere with restore.
      #    Mirrors "Set up JDK 17" from Android workflow.
      # ----------------------------------------------------------------
      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          dotnet-quality: 'ga'

      # ----------------------------------------------------------------
      # 3. Cache NuGet packages
      #    Mirrors "Cache Gradle caches" from Android workflow.
      #    Use %USERPROFILE% path — ~/.nuget resolves incorrectly on
      #    Windows runners when multiple SDK versions are present.
      # ----------------------------------------------------------------
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.USERPROFILE }}\.nuget\packages
          key: nuget-win-${{ hashFiles('**/*.csproj', '**/global.json') }}
          restore-keys: nuget-win-

      # ----------------------------------------------------------------
      # 4. Restore dependencies
      #    Pass -r win-x64 here so restore pre-fetches the right RID
      #    assets; this prevents the "RestoreTask returned false" error
      #    that occurs when RID is only known at publish time.
      #    Also pass -p:PublishReadyToRun=true here — the publish step
      #    below uses ReadyToRun, and R2R needs its own runtime compiler
      #    pack (Microsoft.NETCore.App.Runtime.win-x64) pulled in at
      #    restore time. Without this flag here, restore fetches the
      #    plain runtime pack, and publish later fails with NETSDK1094
      #    ("valid runtime package was not found").
      # ----------------------------------------------------------------
      - name: Restore dependencies
        shell: pwsh
        run: |
          dotnet restore src/VerifySphere/VerifySphere.csproj `
            -r win-x64 `
            -p:PublishReadyToRun=true `
            --locked-mode:false

      # ----------------------------------------------------------------
      # 5. Build & publish self-contained single-file EXE
      #    Mirrors "Build release APK" from Android workflow.
      #    --no-restore skips a second restore since step 4 already ran.
      #
      #    AssemblyVersion and FileVersion must be purely numeric
      #    (major.minor.build.revision). Version (informational) may be
      #    any string. We compute both separately so manual/branch runs
      #    never pass a non-numeric value to AssemblyVersion.
      # ----------------------------------------------------------------
      - name: Build release EXE
        shell: pwsh
        run: |
          $REF = "${{ github.ref_name }}"
          # Strip leading 'v' for SemVer (e.g. v1.0.0 → 1.0.0)
          $SEMVER = $REF -replace '^v', ''

          # AssemblyVersion/FileVersion require EXACTLY 4 parts, each an integer
          # in the range 0-65535 (they are stored as UInt16 in the PE header).
          # A raw date (20260913) or time (162336) blows past that limit, which
          # is what caused the previous failures — this version fixes that by
          # only ever using values that fit: day-of-year (max 366) and
          # minutes-since-midnight (max 1439).
          if ($SEMVER -match '^\d+(\.\d+)*$') {
            $parts = $SEMVER.Split('.') | ForEach-Object {
              $n = [int]$_
              if ($n -gt 65535) { $n = 65535 }   # clamp defensively, just in case
              $n
            }
            while ($parts.Count -lt 4) { $parts += 0 }
            $NUMERIC_VERSION = ($parts[0..3] -join '.')
            $INFO_VERSION    = $SEMVER
          } else {
            $now = Get-Date
            $dayOfYear = $now.DayOfYear                                   # 1-366
            $minuteOfDay = ($now.Hour * 60) + $now.Minute                 # 0-1439
            $NUMERIC_VERSION = "0.0.$dayOfYear.$minuteOfDay"
            $INFO_VERSION    = "manual-$($now.ToString('yyyyMMdd-HHmmss'))"
          }

          Write-Output "INFO_VERSION=$INFO_VERSION  NUMERIC_VERSION=$NUMERIC_VERSION"

          dotnet publish src/VerifySphere/VerifySphere.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            --no-restore `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:PublishReadyToRun=true `
            -p:Version=$INFO_VERSION `
            -p:AssemblyVersion=$NUMERIC_VERSION `
            -p:FileVersion=$NUMERIC_VERSION `
            -o publish/

      # ----------------------------------------------------------------
      # 6. Register verifysphere:// URI scheme in the EXE's manifest
      #    (the installer / setup script does this on the user's machine;
      #     here we just verify the EXE exists and note the scheme)
      #    Mirrors the intent-filter <data android:scheme="verifysphere"/>
      #    in AndroidManifest.xml — no equivalent build step on Windows,
      #    the registry is written by install_uri_scheme.ps1 at install time.
      # ----------------------------------------------------------------
      - name: Verify EXE was produced
        shell: pwsh
        run: |
          $exe = Get-ChildItem publish/ -Filter "*.exe" | Select-Object -First 1
          if (-not $exe) { throw "EXE not found in publish/" }
          Write-Output "EXE: $($exe.FullName)  ($([math]::Round($exe.Length/1MB,2)) MB)"

      # ----------------------------------------------------------------
      # 7. Rename EXE to include version tag
      #    Mirrors "Rename APK" step from Android workflow
      # ----------------------------------------------------------------
      - name: Rename EXE
        id: rename_exe
        shell: pwsh
        run: |
          $REF = "${{ github.ref_name }}"
          $SEMVER = $REF -replace '^v', ''
          if ($SEMVER -match '^\d+(\.\d+)*$') {
            $VERSION_LABEL = $REF   # keep the 'v' prefix for the filename e.g. v1.0.0
          } else {
            $VERSION_LABEL = "manual-$(Get-Date -Format 'yyyyMMdd-HHmmss')"
          }
          $NEW_NAME = "VerifySphere-${VERSION_LABEL}.exe"
          Copy-Item "publish/VerifySphere.exe" $NEW_NAME
          echo "exe_name=$NEW_NAME" >> $env:GITHUB_OUTPUT
          Write-Output "Renamed to: $NEW_NAME"

      # ----------------------------------------------------------------
      # 8. Bundle the URI scheme install script alongside the EXE
      #    This gives users the equivalent of the Android intent-filter
      #    (one-time run: registers verifysphere:// in Windows Registry)
      # ----------------------------------------------------------------
      - name: Copy install script
        shell: pwsh
        run: |
          Copy-Item "scripts/install_uri_scheme.ps1" "install_uri_scheme.ps1"

      # ----------------------------------------------------------------
      # 9. Upload EXE + install script as workflow artifact (always available)
      #    Mirrors "Upload APK artifact" from Android workflow
      # ----------------------------------------------------------------
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: VerifySphere-Windows
          path: |
            ${{ steps.rename_exe.outputs.exe_name }}
            install_uri_scheme.ps1
          retention-days: 30

      # ----------------------------------------------------------------
      # 10. Create GitHub Release (only on version tags)
      #     Mirrors step 10 from Android workflow exactly
      # ----------------------------------------------------------------
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.rename_exe.outputs.exe_name }}
            install_uri_scheme.ps1
          name: "VerifySphere ${{ github.ref_name }}"
          body: |
            ## VerifySphere ${{ github.ref_name }} (Windows)

            ### Installation
            1. Download `${{ steps.rename_exe.outputs.exe_name }}` and `install_uri_scheme.ps1`
            2. Place both files in the same folder (e.g. `C:\Program Files\VerifySphere\`)
            3. Run `install_uri_scheme.ps1` **once** as Administrator to register the `verifysphere://` URI scheme
               ```powershell
               Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass
               .\install_uri_scheme.ps1 -ExePath "C:\Program Files\VerifySphere\${{ steps.rename_exe.outputs.exe_name }}"
               ```
            4. VerifySphere will now open automatically when you click a `verifysphere://` link

            ### Uninstall / Remove URI scheme
            ```powershell
            .\install_uri_scheme.ps1 -Uninstall
            ```

            ### Usage
            Click or navigate to a `verifysphere://verify?data=<encrypted_payload>` link.

            ### Requirements
            - Windows 10 / 11 (x64)
            - Microsoft Edge WebView2 Runtime (usually pre-installed on Windows 10 1803+)
              If missing: https://developer.microsoft.com/microsoft-edge/webview2/
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
